name: Deploy to Azure

# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: e6cb7e09-0b5c-480a-834a-a0f9eb6a5209"
      AZURE_TENANT_ID: 4c25b8a6-17f7-46f9-83f0-54734ab81fb1
      AZURE_SUBSCRIPTION_ID: e6cb7e09-0b5c-480a-834a-a0f9eb6a5209
      AZURE_ENV_NAME: AzureCloud
      AZURE_LOCATION: eastus
      AZURE_RESOURCE_GROUP: Foundry
      AZURE_AIHUB_NAME: ${{ vars.AZURE_AIHUB_NAME }}
      AZURE_AIPROJECT_NAME: Foundry-resource-Fall2026/Projects/Project1
      AZURE_EXISTING_AIPROJECT_ENDPOINT: https://foundry-resource-fall2026.services.ai.azure.com/api/projects/Project1
      AZURE_AIPROJECT_ENDPOINT: "https://foundry-resource-fall2026.services.ai.azure.com/api/projects/Project1"
      PROJECT_ENDPOINT: https://foundry-resource-fall2026.services.ai.azure.com/api/projects/Project1
      AZURE_AISERVICES_NAME: Foundry-resource-Fall2026
      AZURE_SEARCH_SERVICE_NAME: project1-faqs-retrieval
      AZURE_APPLICATION_INSIGHTS_NAME: Insight
      AZURE_CONTAINER_REGISTRY_NAME: ninonet
      AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
      AZURE_STORAGE_ACCOUNT_NAME: ninoblob
      AZURE_BLOB_CONTAINER_NAME: faqs
      AZURE_LOG_ANALYTICS_WORKSPACE_NAME: DefaultWorkspace-0f071448-1eaa-4caa-a0e4-9cd1f7242694
      USE_CONTAINER_REGISTRY: ${{ vars.USE_CONTAINER_REGISTRY }}
      USE_APPLICATION_INSIGHTS: ${{ vars.USE_APPLICATION_INSIGHTS }}
      USE_AZURE_AI_SEARCH_SERVICE: https://project1-faqs-retrieval.search.windows.net}
      AZURE_AI_AGENT_NAME: FAQs-Agent
      AZURE_EXISTING_AGENT_ID: ${{ vars.AZURE_EXISTING_AGENT_ID }}
      AZURE_AI_AGENT_DEPLOYMENT_NAME: gpt-5
      AZURE_AI_AGENT_DEPLOYMENT_SKU: ${{ vars.AZURE_AI_AGENT_DEPLOYMENT_SKU }}
      AZURE_AI_AGENT_DEPLOYMENT_CAPACITY: ${{ vars.AZURE_AI_AGENT_DEPLOYMENT_CAPACITY }}
      AZURE_AI_AGENT_MODEL_NAME: gpt-5
      AZURE_AI_AGENT_MODEL_FORMAT: ${{ vars.AZURE_AI_AGENT_MODEL_FORMAT }}
      AZURE_AI_AGENT_MODEL_VERSION: ${{ vars.AZURE_AI_AGENT_MODEL_VERSION }}
      AZURE_AI_EMBED_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_EMBED_DEPLOYMENT_NAME }}
      AZURE_AI_EMBED_DEPLOYMENT_SKU: ${{ vars.AZURE_AI_EMBED_DEPLOYMENT_SKU }}
      AZURE_AI_EMBED_DEPLOYMENT_CAPACITY: ${{ vars.AZURE_AI_EMBED_DEPLOYMENT_CAPACITY }}
      AZURE_AI_EMBED_MODEL_NAME: ${{ vars.AZURE_AI_EMBED_MODEL_NAME }}
      AZURE_AI_EMBED_MODEL_FORMAT: ${{ vars.AZURE_AI_EMBED_MODEL_FORMAT }}
      AZURE_AI_EMBED_MODEL_VERSION: ${{ vars.AZURE_AI_EMBED_MODEL_VERSION }}
      AZURE_EXISTING_AIPROJECT_RESOURCE_ID: /subscriptions/e6cb7e09-0b5c-480a-834a-a0f9eb6a5209/resourceGroups/Foundry
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


      - name: Deploy Application
        run: azd deploy --no-prompt
